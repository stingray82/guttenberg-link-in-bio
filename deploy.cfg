; ============================================================
; UNIVERSAL DEPLOY v1.5.2
; GUTTENBERG LINK IN BIO — GITHUB RELEASE
; ============================================================
;
; Reusable GitHub deployment configuration.
; Shared PHP tools and credentials are stored centrally.
;
; ============================================================
; 1. PLUGIN DETAILS
; ============================================================

PLUGIN_NAME=Guttenberg Link in Bio
PLUGIN_SLUG=guttenberg-link-in-bio
PLUGIN_DIR=guttenberg-link-in-bio
PLUGIN_FILE=guttenberg-link-in-bio/guttenberg-link-in-bio.php

PLUGIN_TAGS=Links,Bio-links,Linkpage,Guttenberg

; ============================================================
; 2. DEPLOYMENT TARGET
; ============================================================

; github       = GitHub release only
; github+local = GitHub release + SyncBack destination
; local        = Local destination only

DEPLOY_TARGET=github

; 1 = build only, 0 = publish
DEPLOY_DRY_RUN=0

; ============================================================
; 3. CENTRAL SHARED TOOLS
; ============================================================

UNIVERSAL_HOME=C:/Ignore By Avast/0. PATHED Items/Plugins/deployscripts/universal

HEADER_SCRIPT=C:/Ignore By Avast/0. PATHED Items/Plugins/deployscripts/universal/tools/myplugin_headers_rup_gpl3.0.php

GENERATOR_SCRIPT=C:/Ignore By Avast/0. PATHED Items/Plugins/deployscripts/universal/tools/generate_index.php

; ============================================================
; 4. GITHUB SETTINGS
; ============================================================

GITHUB_REPO=stingray82/guttenberg-link-in-bio
GITHUB_CREDENTIAL_PROFILE=stingray82

GIT_BRANCH=main

; Commit and push source and generated UUPD metadata
GIT_PUSH_SOURCE=1

; ============================================================
; 5. PACKAGE SETTINGS
; ============================================================

; Preserve existing release asset filename
ZIP_NAME=guttenberg-link-in-bio.zip

; Preserve local ZIP archives
CLEANUP_RELEASE_ZIPS=0

; Used when DEPLOY_TARGET=github+local or local
DEST_DIR=D:/updater.reallyusefulplugins.com/plugin-updates/custom-packages

; ============================================================
; 6. CHANGELOG AND UUPD METADATA
; ============================================================

CHANGELOG_FILE=C:/Users/Nathan/Git/rup-changelogs/guttenberg-link-in-bio.txt
STATIC_FILE=static.txt

; UUPD metadata is generated in the repository's uupd/
; folder and pushed to GitHub when GIT_PUSH_SOURCE=1.

; ============================================================
; 7. ZIP UTILITY
; ============================================================

SEVEN_ZIP=C:/Ignore By Avast/7-ZipPortable/App/7-Zip/7z.exe

; ============================================================
; END OF CONFIGURATION
; ============================================================

